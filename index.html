<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="builder-api" content="https://android-builder-api.vercel.app">
<meta name="builder-key" content="3e9b0ac6ecd43c716a5c80255f6936b163a3ceaa">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
body { background: radial-gradient(circle at top, #19202c 0, #0d1117 52%, #090c10 100%); overflow-y: scroll; scrollbar-width: none; -ms-overflow-style: none; }
body::-webkit-scrollbar { display: none; }
header { gap: 8px; flex-wrap: wrap; padding: 8px 12px; }
header h1 { font-size: clamp(20px, 4vw, 28px); font-weight: 700; }
#modal { padding: 8px; }
#build-form { max-width: 920px; margin: 0 auto; border-radius: 20px; background: rgba(13,17,23,.95); border: 1px solid #30363d; box-shadow: 0 18px 60px rgba(0,0,0,.45); padding: 10px; }
#build-form label { display: flex; flex-direction: column; gap: 1px; font-size: 13px; color: #c9d1d9; }
#build-form input, #build-form select, #build-form button { min-height: 26px; }
.icon-format-row { gap: 2px; flex-wrap: wrap; align-items: stretch; }
.icon-col, .format-col { flex: 1 1 300px; }
.icon-btns { gap: 2px; flex-wrap: wrap; }
.icon-btn, #config-trigger, #modal-submit, .btn-cancel, .firebase-btn, .step-btn { border-radius: 12px; }
.modal-actions { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
.modal-actions button { flex: 1 1 160px; }
#icon-wrapper { width: 96px; height: 96px; border-radius: 14px; }
#game-icon { width: 96px !important; height: 96px !important; border-radius: 14px; }
#f-app-name { font-size: 16px; font-weight: 600; }
.build-card { gap: 12px; padding: 12px; }
.card-icon { width: 80px; height: 80px; border-radius: 16px; }
.build-card .app-name { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
.build-card .meta { font-size: 13px; }
@keyframes mode-glow-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
#mode-glow {
  animation: mode-glow-pulse 1.5s ease-in-out infinite;
}
@media (max-width: 820px) {
  #modal form { width: calc(100vw - 16px); max-width: calc(100vw - 16px); padding: 10px; }
}
@media (max-width: 720px) {
  #build-form { padding: 8px; border-radius: 14px; }
  .icon-col, .format-col { flex-basis: 100%; }
  #config-dropdown { width: 100% !important; }
  #config-trigger { font-size: 12px; padding: 6px; }
  #build-form input, #build-form select, #build-form button { min-height: 24px; font-size: 13px; }
  #build-form label { font-size: 12px; }
  .modal-actions button { flex: 1; padding: 6px 12px; font-size: 13px; }
  .il .fw { min-height: 24px; padding: 3px 6px; }
  .il .fp { font-size: 11px; }
  .il select, .il input { font-size: 12px; }
  .il .step-btn { width: 18px; height: 18px; font-size: 10px; }
  #icon-wrapper { width: 80px; height: 80px; border-radius: 12px; }
  #game-icon { width: 80px !important; height: 80px !important; border-radius: 12px; }
  .icon-btn { font-size: 10px; padding: 4px 6px; }
  .firebase-btn { font-size: 10px; padding: 4px 8px; }
}
@media (max-width: 480px) {
  #modal form { padding: 6px; }
  #build-form { padding: 6px; border-radius: 10px; }
  #build-form input, #build-form select, #build-form button { min-height: 22px; font-size: 12px; padding: 4px 6px; }
  #build-form label { font-size: 12px; gap: 0; }
  .icon-format-row { gap: 2px; }
  .il .fw { min-height: 20px; padding: 2px 4px; gap: 2px; }
  .il .fp { font-size: 10px; }
  .il select, .il input { font-size: 11px; }
  .il .step-btn { width: 18px; height: 18px; font-size: 10px; }
}
</style>
</head>
<body>
<header style="display:flex;align-items:center;background:#161b22;position:relative">
<h1 style="margin:0;color:#f0f6fc;flex-shrink:0" id="mode-logo">CI / CD</h1>
<span id="mode-indicator" style="display:none"></span>
<div id="loading" class="spinner-inline" style="position:absolute;left:50%;transform:translateX(-50%)"><div class="spinner"></div></div>
<button id="new-build" style="margin-left:auto;flex-shrink:0">сделать app</button>
</header>

<div id="modal" class="hidden">
<form id="build-form">
<div id="detail-banner" style="display:none;margin-bottom:6px;padding:6px 10px;background:#3d2a0a;border:1px solid #d4871a;border-radius:6px;color:#ffb347;font-size:12px;font-weight:600"></div>
<div style="position:relative;width:100%;margin-bottom:2px" id="config-dropdown">
<button type="button" id="config-trigger" style="width:100%;text-align:left;padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:14px;cursor:pointer">📜 история сборок</button>
<div id="config-list" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:999;background:#161b22;border:1px solid #30363d;border-radius:4px;max-height:300px;overflow-y:auto"></div>
</div>
<label class="il">
<span class="fw">
<span class="fp">ИГРА:</span>
<select name="game_repository" id="repo-select">
<option value="zey-win/plinko">Plinko</option>
<option value="zey-win/blackjack">Blackjack</option>
<option value="zey-win/roulette">Roulette</option>
<option value="zey-win/dragon-tiger">Dragon Tiger</option>
<option value="zey-win/baccarat-tiger">Baccarat Tiger</option>
<option value="zey-win/wheel-of-fortune">Wheel of Fortune</option>
<option value="zey-win/Unstopable">Unstopable</option>
<option value="zey-win/SlotSpot">SlotSpot</option>
</select>
<button type="button" id="add-repo-btn" class="step-btn" title="Добавить репозиторий" style="flex-shrink:0;width:26px;height:26px;font-size:14px;line-height:1;padding:0">+</button>
</span>
</label>

<div class="icon-format-row">
<div class="icon-col">
<div id="icon-wrapper">
<div id="icon-placeholder">загрузи иконку</div>
<img id="game-icon" src="" alt="" style="width:96px;height:96px;border-radius:14px;display:none">
<div id="icon-spinner" class="icon-spinner" style="display:none"></div>
</div>
<div class="icon-btns">
<label class="icon-btn icon-btn-upload" id="icon-upload-label">
<input type="file" id="icon-file" accept="image/png" style="display:none">
Загрузить
</label>
<button type="button" id="icon-gen-btn" class="icon-btn icon-btn-gen" title="Сгенерировать">Генерировать</button>
</div>
</div>
<div class="format-col">
<div style="display:flex;flex-direction:column;gap:2px">
<label class="il" style="flex:1">
<span class="fw">
<span class="fp">ФОРМАТ:</span>
<select name="build_format">
<option value="apk">APK</option>
<option value="aab">AAB</option>
<option value="apk_aab">APK+AAB</option>
</select>
</span>
</label>
<label class="il" style="flex:1">
<span class="fw">
<span class="fp">ВЕРСИЯ:</span>
<input name="version_name" id="f-version" type="number" step="0.1" value="1">
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="-1">−</button>
</span>
</label>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<label class="il" style="flex:1">
<span class="fw">
<span class="fp">БИТ:</span>
<select name="fast_build">
<option value="false">32x+64x</option>
<option value="true">64x</option>
</select>
</span>
</label>
<label class="il" style="flex:1">
<span class="fw">
<span class="fp">ВЕРСИЯ КОД:</span>
<input name="version_code" id="f-vcode" type="number" step="1" value="1">
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="-1">−</button>
</span>
</label>
</div>
<label class="il">
<span class="fw">
<span class="fp">zw sdk:</span>
<select name="zeywin_sdk_version" id="sdk-version"></select>
</span>
</label>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:2px;margin-top:1px">
<label class="il" style="flex:1">
<span class="fw">
<span class="fp">НАЗВАНИЕ:</span>
<input name="app_name" id="f-app-name">
</span>
</label>
<label class="il" style="flex:1">
<span class="fw">
<span class="fp">PACKAGE NAME:</span>
<input name="package_name" id="f-pkg">
</span>
</label>
</div>
<label class="pkg-hidden il">
<span class="fw">
<span class="fp">API KEY:</span>
<input name="zeywin_api_key" id="f-zeywin-key">
</span>
</label>
<label class="pkg-hidden il">
<span class="fw">
<span class="fp">AdMob ID:</span>
<input name="admob_app_id" id="f-admob-app">
</span>
</label>
<label class="admob-field il">
<span class="fw">
<span class="fp">AdMob Banner:</span>
<input name="admob_banner">
</span>
</label>
<label class="admob-field il">
<span class="fw">
<span class="fp">AdMob Inter:</span>
<input name="admob_interstitial">
</span>
</label>
<label class="admob-field il">
<span class="fw">
<span class="fp">AdMob Rew:</span>
<input name="admob_rewarded">
</span>
</label>
<label class="pkg-hidden il firebase-row" id="firebase-label">
<span class="fw">
<span class="fp">firebase.google-services</span>
<input type="file" id="firebase-file" accept=".json" style="display:none">
<span class="firebase-btn" id="firebase-btn">Загрузить</span>
<span id="firebase-status" style="font-size:11px;color:#fff;display:none"></span>
</span>
</label>

<div class="modal-actions">
<button type="button" id="modal-cancel" class="btn-cancel">Отмена</button>
<button type="submit" id="modal-submit">Собрать</button>
</div>
</form>
    <div id="build-progress" class="hidden">
      <button type="button" id="bp-close" title="Закрыть">✕</button>
      <div id="bp-spinner">
        <div class="spinner" id="bp-spinner-icon"></div>
        <div class="bp-caption">минуточку...</div>
      </div>
      <div id="bp-steps"></div>
    </div>
  </div>

  <div id="detail-modal" class="hidden" style="position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.7)">
    <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;max-width:680px;width:calc(100vw - 32px);max-height:90vh;overflow-y:auto;padding:16px;position:relative">
      <button id="dm-close" style="position:absolute;top:8px;right:8px;background:none;border:none;color:#aaa;font-size:20px;cursor:pointer">✕</button>
      <div id="dm-content"></div>
    </div>
  </div>

    <script src="builder.js?v14"></script>
  <script>
    (function () {
      var sp = document.getElementById("bp-spinner-icon");
      if (!sp) return;
      function randomizeSpinner() {
        var size = 28 + Math.floor(Math.random() * 40);   // random size 28–68 px
        var dur = (0.4 + Math.random() * 2.4).toFixed(2);  // random spin speed 0.4–2.8 s
        sp.style.width = size + "px";
        sp.style.height = size + "px";
        sp.style.animationDuration = dur + "s";
      }
      randomizeSpinner();
      setInterval(randomizeSpinner, 3000);
    })();
  </script>
</body>
</html>
