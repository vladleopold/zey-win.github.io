<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="builder-api" content="https://zeywin-android-builder-api.vercel.app">
<meta name="builder-key" content="3e9b0ac6ecd43c716a5c80255f6936b163a3ceaa">
<link rel="stylesheet" href="styles-20260626.css">
<style>
body { background: radial-gradient(circle at top, #19202c 0, #0d1117 52%, #090c10 100%); }
header { gap: 12px; flex-wrap: wrap; }
header h1 { font-size: clamp(18px, 4vw, 24px); }
#modal { padding: 12px; }
#build-form { max-width: 920px; margin: 0 auto; border-radius: 24px; background: rgba(13,17,23,.95); border: 1px solid #30363d; box-shadow: 0 18px 60px rgba(0,0,0,.45); padding: 16px; }
#build-form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #c9d1d9; }
#build-form input, #build-form select, #build-form button { min-height: 44px; }
.icon-format-row { gap: 14px; flex-wrap: wrap; align-items: stretch; }
.icon-col, .format-col { flex: 1 1 320px; }
.icon-btns { gap: 8px; flex-wrap: wrap; }
.icon-btn, #config-trigger, #modal-submit, .btn-cancel, .firebase-btn, .step-btn { border-radius: 14px; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.modal-actions button { flex: 1 1 180px; }
.meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) {
  #build-form { padding: 14px; border-radius: 20px; }
  .meta-row, .form-row, .ver-format-row, .arch-vc-row { grid-template-columns: 1fr; flex-direction: column; }
  .icon-col, .format-col { flex-basis: 100%; }
  #config-dropdown { width: 100% !important; }
  #config-trigger { font-size: 13px; }
}
</style>
</head>
<body>
<header style="display:flex;align-items:center;padding:10px 16px;background:#161b22;position:relative">
<h1 style="margin:0;font-size:24px;color:#f0f6fc;flex-shrink:0">ZeyWin CI/CD</h1>
<div id="loading" class="spinner-inline" style="position:absolute;left:50%;transform:translateX(-50%)"><div class="spinner"></div></div>
<button id="new-build" style="margin-left:auto;flex-shrink:0">сделать app</button>
</header>

<div id="modal" class="hidden">
<form id="build-form">
<div class="form-row">
<label style="flex:3">Игра
<select name="game_repository" id="repo-select">
<option value="zey-win/plinko">Plinko</option>
<option value="zey-win/blackjack">Blackjack</option>
<option value="zey-win/roulette">Roulette</option>
<option value="zey-win/dragon-tiger">Dragon Tiger</option>
<option value="zey-win/baccarat-tiger">Baccarat Tiger</option>
<option value="zey-win/wheel-of-fortune">Wheel of Fortune</option>
<option value="zey-win/Unstopable">Unstopable</option>
<option value="zey-win/SlotSpot">SlotSpot</option>
</select>
</label>
<label style="flex:2">Ветка
<select name="game_ref" id="branch-select">
</select>
</label>
</div>

<div class="icon-format-row">
<div class="icon-col">
<div id="icon-wrapper">
<img id="game-icon" src="" alt="" style="width:72px;height:72px;border-radius:10px;display:none">
<div id="icon-spinner" class="icon-spinner" style="display:none"></div>
</div>
<div class="icon-btns">
<label class="icon-btn icon-btn-upload" id="icon-upload-label">
<input type="file" id="icon-file" accept="image/png" style="display:none">
Загрузить
</label>
<button type="button" id="icon-gen-btn" class="icon-btn icon-btn-gen" title="Сгенерировать">Генерировать</button>
<button type="button" id="sparks-ai-btn" class="icon-btn icon-btn-gen" title="Автозаполнить всё">sparks ai</button>
</div>
</div>
<div class="format-col">
<div class="ver-format-row">
<label style="flex:1">Формат <select name="build_format">
<option value="apk">APK</option>
<option value="aab">AAB</option>
<option value="apk_aab">APK+AAB</option>
</select></label>
<label style="flex:1">Версия
<div style="display:flex;gap:4px;align-items:center">
<input name="version_name" id="f-version" type="number" step="0.1" value="1" style="flex:1">
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="-1">−</button>
</div>
</label>
</div>
<div class="arch-vc-row">
<label style="flex:1">bit's <select name="fast_build">
<option value="false">32x+64x</option>
<option value="true">64x</option>
</select></label>
<label style="flex:1">Version Code
<div style="display:flex;gap:4px;align-items:center">
<input name="version_code" id="f-vcode" type="number" step="1" value="1" style="flex:1">
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="-1">−</button>
</div>
</label>
</div>
<label style="margin-top:6px">Режим версии
<select name="version_mode" id="version-mode">
<option value="auto_next">Следующая i+1</option>
<option value="manual">Вручную</option>
</select>
</label>
<label style="margin-top:6px">Версия ZeyWin Ads SDK
<select name="zeywin_sdk_version" id="sdk-version"></select>
</label>
</div>
</div>

<div class="meta-row" style="margin-top:8px">
<label>Название приложения
  <span style="display:flex;gap:6px;align-items:center">
    <input name="app_name" id="f-app-name" style="flex:1">
    <div style="position:relative;width:220px" id="config-dropdown">
      <button type="button" id="config-trigger" style="width:100%;text-align:left;padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:14px;cursor:pointer">📜 история сборок</button>
      <div id="config-list" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:999;background:#161b22;border:1px solid #30363d;border-radius:4px;max-height:300px;overflow-y:auto"></div>
    </div>
  </span>
</label>
<label>Package name <input name="package_name" id="f-pkg"></label>
</div>
<label class="pkg-hidden">ZeyWin API Key <span class="key-copy-wrap"><input name="zeywin_api_key" id="f-zeywin-key"><button type="button" class="copy-btn" id="copy-api-key" title="Copy API key" aria-label="Copy">⧉</button></span></label>
<label class="pkg-hidden">AdMob App ID <input name="admob_app_id" id="f-admob-app"></label>
<label class="admob-field">AdMob Banner <input name="admob_banner"></label>
<label class="admob-field">AdMob Interstitial <input name="admob_interstitial"></label>
<label class="admob-field">AdMob Rewarded <input name="admob_rewarded"></label>
<label class="pkg-hidden firebase-row" id="firebase-label">
<span style="font-size:15px;font-weight:600">Firebase. google-services.json</span>
<input type="file" id="firebase-file" accept=".json" style="display:none">
<span class="firebase-btn" id="firebase-btn">Загрузить</span>
<span id="firebase-status" style="font-size:13px;color:#fff;display:none;margin-left:8px"></span>
</label>

<div class="modal-actions">
<button type="button" id="modal-cancel" class="btn-cancel">Отмена</button>
<button type="submit" id="modal-submit">Собрать</button>
</div>
</form>
<div id="build-progress" class="hidden">
<div id="bp-steps"></div>
</div>
</div>

<script src="builder.js?v3"></script>
</body>
</html>
